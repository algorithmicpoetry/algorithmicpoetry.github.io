name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
  workflow_dispatch:

# Set repository secrets CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID, then enable
# via repository variable CLOUDFLARE_DEPLOY=true (Settings → Secrets and variables → Actions → Variables).
jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ vars.CLOUDFLARE_DEPLOY == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
